# Configuración de Alembic para FríoTrack.
#
# La URL de la base no vive aquí: `alembic/env.py` la toma de
# `get_settings().database_url` (backend/.env o variables de entorno).
# Las rutas usan %(here)s, así que los mismos comandos funcionan desde
# backend/ y desde la raíz con `alembic -c backend/alembic.ini ...`.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
