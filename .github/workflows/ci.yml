name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: friotrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Instalar dependencias
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install -r requirements.txt
          fi
      - name: Lint con Ruff
        run: ruff check .
      - name: Migraciones de Alembic
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/friotrack
          ENTORNO: local
        run: |
          # Base vacía: el entrypoint aplica el baseline.
          python -m app.db.migrar
          # Segunda corrida: debe salir sin DDL.
          python -m app.db.migrar | tee /tmp/migrar.log
          grep -q "Esquema al día" /tmp/migrar.log
          alembic check

          # Base legada: create_all sin alembic_version; el entrypoint hace stamp.
          alembic downgrade base
          python - <<'PY'
          from sqlalchemy import text
          from app.db.session import get_engine

          with get_engine().begin() as conn:
              conn.execute(text("DROP TABLE IF EXISTS alembic_version"))
          PY
          python -c "import app.db.models; from app.db.base import Base; from app.db.session import get_engine; Base.metadata.create_all(get_engine())"
          python -m app.db.migrar
          alembic current | grep -q "0001"
          alembic check

          # Ciclo de downgrade/upgrade del baseline en local.
          alembic downgrade base
          alembic upgrade head
      - name: Pruebas con pytest
        run: pytest -q
      - name: Lint del detector SIEM
        run: ruff check ../security --config pyproject.toml
      - name: Pruebas del detector SIEM
        run: cd .. && PYTHONPATH=. pytest -q security/detector/tests

  dashboard:
    name: Dashboard (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint con ESLint
        run: npm run lint
      - name: Pruebas con Vitest
        run: npm test
      - name: Formato con Prettier
        run: npm run format:check
      - name: Build
        run: npm run build
