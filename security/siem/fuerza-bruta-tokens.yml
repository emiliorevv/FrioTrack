title: Fuerza bruta de tokens en ingesta de telemetría
id: 3b8e2f6a-9c41-4d7e-8a15-2f6c0d9e7b41
status: experimental
description: Muchos intentos fallidos de autenticación contra el endpoint de sensores desde la misma IP
author: Equipo FríoTrack
date: 2026-11-11
logsource:
  product: friotrack
  service: api_access
detection:
  selection:
    ruta: /api/telemetria
    status:
      - 401
      - 403
  timeframe: 5m
  condition: selection | count() by ip_origen >= 10
level: high
tags:
  - attack.credential_access
  - attack.t1110
falsepositives:
  - Sensor mal configurado con un token viejo
# Acción de respuesta (no es parte del estándar Sigma, la ejecuta el detector):
# bloquear ip_origen 1 hora y avisar al responsable.
