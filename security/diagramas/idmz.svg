<text x="40" y="981" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Purdue/ISA-95: OT 0–2 · Gateway 2–3 · IDMZ 3.5 · IT 4 · Nube 5. Zero Trust: identidad por dispositivo, mínimo privilegio y TLS en cada salto externo.</text>
