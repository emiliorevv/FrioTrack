<text x="219" y="563" font-size="10" font-weight="700" fill="#dc2626" text-anchor="end">IT → OT</text>
<rect x="40" y="770" width="390" height="150" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
<text x="60" y="798" font-size="15" font-weight="700" fill="#334155" text-anchor="start">INVITADOS · VLAN 30</text>
<rect x="340" y="780" width="70" height="24" rx="12.0" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
<text x="375.0" y="795.5" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">VLAN 30</text>
<text x="60" y="820" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Wi-Fi de clientes · aislada de todo lo interno</text>
<rect x="62" y="836" width="362" height="60" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="243" y="861" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">SSID separado · aislamiento de clientes</text>
<text x="243" y="879" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">sin rutas hacia OT, IT ni la nube interna</text>
<path d="M432,852 H542" fill="none" stroke="#0f766e" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ok)"/>
<text x="487" y="840" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">80/443</text>
