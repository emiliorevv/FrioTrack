<text x="630" y="838" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Internet</text>
<text x="630" y="858" font-size="9.5" font-weight="400" fill="#475569" text-anchor="middle">solo salida de invitados</text>
<rect x="860" y="138" width="470" height="798" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
<text x="884" y="168" font-size="15" font-weight="700" fill="#065f46" text-anchor="start">NUBE · Nivel 5</text>
<text x="884" y="190" font-size="11.5" font-weight="400" fill="#065f46" text-anchor="start">Servicios gestionados · TLS de extremo a extremo</text>
<rect x="880" y="230" width="220" height="110" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="1.4"/>
<text x="990" y="256" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">API FastAPI — Render</text>
<text x="990" y="276" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">ingesta y reglas ERP</text>
<text x="990" y="294" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">valida token de sensor y JWT</text>
<text x="990" y="312" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">escribe logs_acceso (SIEM)</text>
<text x="990" y="330" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">SSE /api/stream</text>
<rect x="1130" y="200" width="180" height="100" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="1.4"/>
