<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>FríoTrack — Segmentación IDMZ y Zero Trust</title>
<desc>Zonas OT, IDMZ, IT corporativa, invitados y nube con VLANs, puertos y flujos permitidos; el flujo IT a OT está denegado.</desc>
<defs>
  <marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
  </marker>
  <marker id="arrow-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
  </marker>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
  </style>
</defs>
<rect width="1600" height="1000" fill="#f8fafc"/>
<text x="48" y="54" font-size="30" font-weight="700" fill="#0f172a" text-anchor="start">FríoTrack — Segmentación IDMZ y Zero Trust</text>
<text x="48" y="81" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Modelo Purdue / ISA-95 · VLANs, puertos y flujos mínimos (ADR-0006)</text>
