<text x="812" y="267" font-size="10.5" font-weight="700" fill="#0f766e" text-anchor="middle">443 TLS</text>
<rect x="40" y="580" width="390" height="150" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
<text x="60" y="608" font-size="15" font-weight="700" fill="#3730a3" text-anchor="start">IT CORPORATIVA · Nivel 4</text>
