<rect x="1270" y="36" width="74" height="22" rx="11" fill="#ecfdf5" stroke="#34d399" stroke-width="1"/>
<text x="1307" y="51" font-size="8.5" font-weight="700" fill="#047857" text-anchor="middle">ZERO TRUST</text>
<text x="1355" y="51" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">mínimo privilegio</text>
<text x="1270" y="78" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">TLS en cada salto externo</text>
<rect x="40" y="138" width="390" height="398" rx="16" fill="#eaf4ff" stroke="#3b82f6" stroke-width="1.6"/>
<text x="60" y="168" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="start">ZONA OT · Nivel 0–2</text>
<rect x="340" y="150" width="70" height="24" rx="12.0" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
<text x="375.0" y="165.5" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">VLAN 10</text>
<text x="60" y="190" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start">Sensores de frío · sin salida directa a Internet</text>
<rect x="60" y="208" width="350" height="112" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.4"/>
<text x="74" y="232" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Sensores de frío (5 cámaras)</text>
<text x="74" y="250" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">Temperatura · humedad · puerta · token por sensor</text>
<rect x="74" y="264" width="58" height="34" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="103" y="285" font-size="9.5" font-weight="600" fill="#1e40af" text-anchor="middle">Pescado</text>
