<text x="247" y="338" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">local (Modbus/serial)</text>
<text x="247" y="354" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">o HTTP interno</text>
<rect x="160" y="365" width="190" height="80" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.4"/>
