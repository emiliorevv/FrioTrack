<rect x="249" y="646" width="175" height="64" rx="9" fill="#ffffff" stroke="#818cf8" stroke-width="1.3"/>
<text x="336.5" y="672" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Punto de venta (POS)</text>
<text x="336.5" y="690" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">red separada de OT</text>
