<text x="255" y="409" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">Nivel 2–3 · VLAN 10</text>
<text x="255" y="427" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">solo habla con el proxy</text>
<rect x="500" y="138" width="280" height="398" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.6"/>
<text x="520" y="168" font-size="15" font-weight="700" fill="#92400e" text-anchor="start">IDMZ · Nivel 3.5</text>
<rect x="700" y="150" width="60" height="24" rx="12.0" fill="#ffedd5" stroke="#fdba74" stroke-width="1"/>
<text x="730.0" y="165.325" font-size="9.5" font-weight="700" fill="#9a3412" text-anchor="middle">VLAN 15</text>
<text x="520" y="190" font-size="11.5" font-weight="400" fill="#7c2d12" text-anchor="start">Firewall y proxy de salida</text>
<rect x="530" y="250" width="220" height="180" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.4"/>
<text x="640" y="278" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Firewall + proxy</text>
<text x="640" y="297" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">de salida</text>
<text x="640" y="318" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">niega todo por omisión</text>
<text x="640" y="340" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">443 TLS · salida única</text>
<text x="640" y="360" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">solo POST /api/telemetria</text>
<text x="640" y="382" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">token por sensor</text>
<text x="640" y="400" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">registra en logs_acceso</text>
<text x="520" y="470" font-size="10.5" font-weight="600" fill="#92400e" text-anchor="start">Único punto de salida de la OT</text>
<text x="520" y="488" font-size="10" font-weight="400" fill="#92400e" text-anchor="start">cualquier otro flujo se niega</text>
<path d="M350,405 H527" fill="none" stroke="#0f766e" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ok)"/>
