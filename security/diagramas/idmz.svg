<text x="1220" y="246" font-size="10.5" font-weight="700" fill="#047857" text-anchor="middle">5432 TLS</text>
<text x="1220" y="264" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">logs_acceso · lecturas</text>
<text x="1220" y="282" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">alertas · IPS · inventario</text>
<rect x="1130" y="360" width="180" height="90" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="1.4"/>
<text x="1220" y="386" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Twilio</text>
<text x="1220" y="406" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">SMS al jefe de cocina</text>
<text x="1220" y="424" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">443 TLS</text>
<rect x="880" y="520" width="220" height="100" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="1.4"/>
<text x="990" y="546" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Dashboard — Vercel</text>
<text x="990" y="566" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">React + SSE · responsivo</text>
<text x="990" y="584" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">consulta con JWT</text>
<text x="990" y="602" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">KPIs, alertas y mermas</text>
<rect x="880" y="740" width="220" height="100" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="1.4"/>
<text x="990" y="766" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Cloudflare Worker</text>
<text x="990" y="786" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">Cron Trigger cada minuto</text>
<text x="990" y="804" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">POST /api/simulador/tick</text>
<text x="990" y="822" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">mantiene viva la API</text>
