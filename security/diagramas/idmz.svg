<text x="1002" y="438" font-size="10.5" font-weight="700" fill="#0f766e" text-anchor="start">443 · JWT</text>
<path d="M880,790 H870 V320 H877" fill="none" stroke="#0f766e" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ok)"/>
<text x="882" y="700" font-size="10" font-weight="700" fill="#0f766e" text-anchor="start">443 · POST /api/simulador/tick</text>
<rect x="1130" y="470" width="180" height="150" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
<text x="1144" y="496" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="start">Controles Zero Trust</text>
<text x="1144" y="518" font-size="9.5" font-weight="400" fill="#334155" text-anchor="start">•  token de sensor: su cámara</text>
<text x="1144" y="538" font-size="9.5" font-weight="400" fill="#334155" text-anchor="start">•  CRON_TOKEN: /simulador/tick</text>
<text x="1144" y="558" font-size="9.5" font-weight="400" fill="#334155" text-anchor="start">•  JWT: lectura y alertas</text>
<text x="1144" y="578" font-size="9.5" font-weight="400" fill="#334155" text-anchor="start">•  TLS en los saltos externos</text>
<text x="1144" y="598" font-size="9.5" font-weight="400" fill="#334155" text-anchor="start">•  cada petición → logs_acceso</text>
<rect x="1360" y="700" width="210" height="160" rx="16" fill="#faf5ff" stroke="#a855f7" stroke-width="1.6"/>
<rect x="1376" y="714" width="178" height="80" rx="9" fill="#ffffff" stroke="#c084fc" stroke-width="1.3"/>
<text x="1465" y="738" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Celular / PC del equipo</text>
<text x="1465" y="756" font-size="9.5" font-weight="400" fill="#475569" text-anchor="middle">gerente y jefe de cocina</text>
<text x="1465" y="776" font-size="9.5" font-weight="700" fill="#6b21a8" text-anchor="middle">443 · JWT</text>
<text x="1376" y="820" font-size="12.5" font-weight="700" fill="#6b21a8" text-anchor="start">USUARIO / ACCESO</text>
<text x="1376" y="838" font-size="9.5" font-weight="400" fill="#6b21a8" text-anchor="start">dispositivo fuera de la nube</text>
