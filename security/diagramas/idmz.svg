<path d="M1058,74 H1097" fill="none" stroke="#dc2626" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-deny)"/>
<text x="1107" y="78" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">Flujo denegado</text>
